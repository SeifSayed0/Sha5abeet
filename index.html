  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    .container { width: 100%; max-width: 650px; }
    
    /* شاشة تسجيل الاسم */
    #login-modal {
      position: fixed; inset: 0; background: #0f172a; display: flex;
      flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; z-index: 1000;
    }
    .modal-box { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }

    /* حقول الإدخال والأزرار */
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background: #64748b; cursor: not-allowed; }


    /* صندوق إضافة فكرة */
    .add-box { background: #1e293b; padding: 20px; border-radius: 14px; margin-bottom: 30px; border: 1px dashed #38bdf8; }
    
    /* الكروت والعناوين */
    h2 { font-size: 18px; margin: 20px 0 10px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-right: 4px solid #3b82f6; line-height: 1.6; }
    .visitor-card { border-right-color: #10b981; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .card-meta { font-size: 12px; color: #64748b; }
    
    /* زر الإبلاغ */
    .report-btn {
      width: auto;
      padding: 3px 8px;
      font-size: 11px;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .report-btn:hover {
      color: #ef4444;
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .report-btn.reported {
      color: #ef4444;
      border-color: #ef4444;
      cursor: not-allowed;
    }

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwluFOIpSIN6gOYggwS4WWLS6bsDndtDUPcKOn34iSe_CzCxnYQxbxtKAHwrQ8XgK3D/exec";

  let currentName = localStorage.getItem('site_user') || '';

  function saveName() {
    const val = document.getElementById('visitor-name').value.trim();
    if (!val) return alert('اكتب اسمك الأول!');
    localStorage.setItem('site_user', val);
    currentName = val;
    initSite();
  }

  function editName() {
    const newName = prompt('اكتب اسمك الجديد:', currentName);
    if (newName && newName.trim() !== '') {
      currentName = newName.trim();
      localStorage.setItem('site_user', currentName);
      document.getElementById('user-display').innerText = currentName;
    }
  }

  function initSite() {
    document.getElementById('login-modal').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-display').innerText = currentName;
    loadAllThoughts();
  }

  async function loadAllThoughts() {
    const ownerDiv = document.getElementById('owner-list');
    const visitorDiv = document.getElementById('visitor-list');

    // 1. جلب أفكارك الخاصة من الورقة الأولى (Owner)
    try {
      const resOwner = await fetch(`${SCRIPT_URL}?sheet=Owner`);
      const ownerData = await resOwner.json();
      
      if (Array.isArray(ownerData) && ownerData.length > 0) {
        ownerDiv.innerHTML = ownerData.slice().reverse().map(i => i.thought ? `
          <div class="card">
            <p>${i.thought}</p>
            ${i.date ? `<span class="card-meta">${i.date}</span>` : ''}
          </div>` : '').join('');
      } else {
        ownerDiv.innerHTML = '<p style="color:#64748b;">مفيش خواطر مكتوبة لسه.</p>';
      }
    } catch (e) {
      ownerDiv.innerHTML = '<p style="color:#ef4444;">مشكلة في تحميل الخواطر.</p>';
    }

    // 2. جلب أفكار الزوار المقبولة من ورقة Visitors
    try {
      const resVisitors = await fetch(`${SCRIPT_URL}?sheet=Visitors&status=approved`);
      const visitorData = await resVisitors.json();
      
      if (Array.isArray(visitorData) && visitorData.length > 0) {
        visitorDiv.innerHTML = visitorData.slice().reverse().map((i, index) => i.thought ? `
          <div class="card visitor-card">
            <p>${i.thought}</p>
            <div class="card-footer">
              <span class="card-meta">كتبها: <strong>${i.name}</strong></span>
              <button class="report-btn" id="rep-btn-${index}" onclick="handleReport('${encodeURIComponent(i.name)}', '${encodeURIComponent(i.thought)}', 'rep-btn-${index}')">
                🚩 إبلاغ
              </button>
            </div>
          </div>` : '').join('');
      } else {
        visitorDiv.innerHTML = '<p style="color:#64748b;">لا توجد مشاركات منشورة حالياً.</p>';
      }
    } catch (e) {
      visitorDiv.innerHTML = '<p style="color:#64748b;">لا توجد مشاركات منشورة.</p>';
    }
  }

  async function sendThought() {
    const text = document.getElementById('visitor-input').value.trim();
    if (!text) return alert('اكتب حاجة الأول!');
    
    const btn = document.getElementById('send-btn');
    btn.innerText = 'جاري الإرسال...';
    btn.disabled = true;

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          sheet: "Visitors",
          data: {
            name: currentName,
            thought: text
          }
        })
      });

      alert('تم إرسال فكرتك بنجاح! هتظهر أول ما أوافق عليها 💙');
      document.getElementById('visitor-input').value = '';
    } catch (err) {
      alert('حصل مشكلة أثناء الإرسال، حاول تاني.');
    } finally {
      btn.innerText = 'إرسال الفكرة';
      btn.disabled = false;
    }
  }

  async function handleReport(encodedName, encodedThought, btnId) {
    const authorName = decodeURIComponent(encodedName);
    const thoughtContent = decodeURIComponent(encodedThought);
    const btn = document.getElementById(btnId);

    const confirmReport = confirm("هل تريد الإبلاغ عن هذه المشاركة لمراجعتها؟");
    if (!confirmReport) return;

    btn.disabled = true;
    btn.innerText = "جاري الإبلاغ...";

    try {
      const today = new Date().toLocaleDateString('ar-EG');
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          sheet: "Reports",
          data: {
            name: authorName,
            thought: thoughtContent,
            report_date: today
          }
        })
      });

      alert('شكراً لك، تم استلام البلاغ وسيتم مراجعة المحتوى.');
      btn.innerText = 'تم الإبلاغ ✓';
      btn.classList.add('reported');
    } catch (error) {
      alert('حدث خطأ أثناء إرسال البلاغ، حاول مرة أخرى.');
      btn.disabled = false;
      btn.innerText = '🚩 إبلاغ';
    }
  }

  if (currentName) {
    initSite();
  }
  
</script>
